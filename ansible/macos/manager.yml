---
# The manager's own policy, applied by converge on every applying run:
# check mode first, then for real, with a receipt (macos-manager) that a full
# re-apply replaces at least once a day. It never asks for a password and no
# play becomes root: what needs root runs through the narrow grant
# manager-privilege.yml installs once (with the T3 policy and the log
# rotation), and without the grant it is skipped here and reported by its
# check.
#
# Manager power policy. Workers depend on the manager's singleton services
# (CLI proxy, Beszel hub), so the manager never sleeps on AC power and starts
# again by itself when power returns (autorestart). Sleep on battery is left
# to the human. The settings are the `pmset` object in policy.json; converge
# measures the same object as manager:power.
- name: Keep the fleet manager awake on AC power
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - policy.json
  tasks:
    - name: Inspect effective power management settings
      ansible.builtin.command:
        argv: [/usr/bin/pmset, -g, custom]
      changed_when: false
      check_mode: false
      register: pmset_custom
    # Lists, never runs: whether `pmset -c` may run without a password.
    - name: Inspect the manager's power grant
      ansible.builtin.command:
        argv: [/usr/bin/sudo, -n, -l, /usr/bin/pmset, -c, sleep, '0']
      changed_when: false
      check_mode: false
      failed_when: false
      register: pmset_grant
    - name: Report that the power settings wait for the grant
      ansible.builtin.debug:
        msg: 'The power grant is not in place; manager:power says how to give it once.'
      when: pmset_grant.rc != 0
    # pmset accepts a setting this Mac does not have and keeps nothing (a
    # virtual Mac has no Wake-on-LAN, so no womp): applying it again on every
    # run would never converge. It is reported instead of applied.
    - name: Report the declared AC power settings this Mac does not have
      ansible.builtin.debug:
        msg: 'pmset on this Mac has no AC setting {{ item.key }}; it is not applied.'
      loop: '{{ pmset | dict2items }}'
      loop_control:
        label: '{{ item.key }}'
      vars:
        ac_section: "{{ pmset_custom.stdout.split('AC Power:') | last }}"
      when: ac_section is not search('^\\s*' ~ item.key ~ '\\s', multiline=True)
    - name: Apply the declared AC power settings
      ansible.builtin.command:
        argv:
          [
            /usr/bin/sudo,
            -n,
            /usr/bin/pmset,
            -c,
            '{{ item.key }}',
            '{{ item.value }}',
          ]
      loop: '{{ pmset | dict2items }}'
      loop_control:
        label: '{{ item.key }}'
      vars:
        ac_section: "{{ pmset_custom.stdout.split('AC Power:') | last }}"
        observed: "{{ ac_section | regex_findall('^\\s*' ~ item.key ~ '\\s+(\\S+)', multiline=True) | first | default('') }}"
      when:
        - pmset_grant.rc == 0
        - observed not in ['', item.value]
      changed_when: true

# Docker Desktop hosts the CLI proxy and the monitoring hub, so it starts at
# login: after a power cut the manager comes back without a person. The
# setting is the `dockerDesktop` object in policy.json; converge measures it
# as part of manager:boot-recovery. Only that key of the user's settings file
# is changed.
- name: Start Docker Desktop at login
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - policy.json
  vars:
    docker_settings: "{{ lookup('ansible.builtin.env', 'HOME') }}/{{ dockerDesktop.settings }}"
  tasks:
    - name: Find the Docker Desktop settings
      ansible.builtin.stat:
        path: '{{ docker_settings }}'
      register: docker_settings_file
    - name: Read the Docker Desktop settings
      ansible.builtin.slurp:
        src: '{{ docker_settings }}'
      register: docker_settings_text
      when: docker_settings_file.stat.exists
    - name: Turn on start at login, keeping every other setting
      ansible.builtin.copy:
        dest: '{{ docker_settings }}'
        content: "{{ current | combine({dockerDesktop.key: true}) | to_nice_json(indent=2) }}\n"
        mode: '0644'
      vars:
        current: '{{ docker_settings_text.content | b64decode | from_json }}'
      # Docker Desktop writes the file the first time it runs.
      when:
        - docker_settings_file.stat.exists
        - not (current[dockerDesktop.key] | default(false) | bool)

# notify compares the fleet's health with its last run, notifies on a
# change and stores the heartbeat the off-machine workflow
# (.github/workflows/fleet-heartbeat.yml) reads. It runs from the checkout
# converge last applied (fleet/current) with that checkout's locked Bun, on
# the interval `manager.schedule.watchMinutes` in fleet.json sets
# (fleet_watch_minutes), or else policy.json's. manager:watch measures it.
- name: Watch the fleet on a schedule
  hosts: localhost
  connection: local
  become: false
  # gather_subset: ['!all'] still gathers the minimal facts, and those ask
  # Homebrew, which blocks on the lock a brew update holds. HOME and the user
  # id are read directly instead.
  gather_facts: false
  vars_files:
    - policy.json
  vars:
    watch_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    watch_label: '{{ fleetWatch.label }}'
    watch_minutes: '{{ fleet_watch_minutes | default(fleetWatch.intervalMinutes) | int }}'
    watch_logs: '{{ watch_home }}/{{ jobLogs.directory }}'
    watch_plist: '{{ watch_home }}/Library/LaunchAgents/{{ watch_label }}.plist'
  tasks:
    - name: Read the user id for the launchd domain
      ansible.builtin.command:
        argv: [/usr/bin/id, -u]
      check_mode: false
      changed_when: false
      register: watch_uid
    - name: Name the launchd domain
      ansible.builtin.set_fact:
        watch_domain: 'gui/{{ watch_uid.stdout }}'
      # A fact is not a change to the machine. The second converge must report
      # changed=0.
      changed_when: false
    - name: Find the launcher in the applied checkout
      ansible.builtin.stat:
        path: '{{ watch_home }}/.local/share/personal/fleet/current/bootstrap/homelab'
      register: applied_launcher
    - name: Install the public launcher from the applied checkout
      ansible.builtin.file:
        src: '{{ applied_launcher.stat.path }}'
        dest: '{{ watch_home }}/.local/bin/homelab'
        state: link
      when: applied_launcher.stat.executable | default(false)
    - name: Require an interval the schema allows
      ansible.builtin.assert:
        that:
          - watch_minutes | int >= 5
          - watch_minutes | int <= 1440
        fail_msg: MANAGER_WATCH_INTERVAL_INVALID; manager.schedule.watchMinutes is from 5 to 1440.
    - name: Create the directories of the watch job
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - '{{ watch_logs }}'
        - '{{ watch_home }}/Library/LaunchAgents'
    - name: Install the notify launch agent
      ansible.builtin.copy:
        dest: '{{ watch_plist }}'
        mode: '0644'
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <!-- Managed by homelab: notify -->
          <plist version="1.0"><dict>
            <key>Label</key><string>{{ watch_label }}</string>
            <key>ProgramArguments</key><array>
              <string>{{ watch_home }}/.local/bin/mise</string>
              <string>exec</string>
              <string>--locked</string>
              <string>bun</string>
              <string>--</string>
              <string>bun</string>
              <string>src/cli/cli.ts</string>
              <string>notify</string>
              <string>--json</string>
            </array>
            <key>WorkingDirectory</key><string>{{ watch_home }}/.local/share/personal/fleet/current</string>
            <key>EnvironmentVariables</key><dict>
              <key>PATH</key><string>{{ watch_home }}/.local/share/mise/shims:{{ watch_home }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin</string>
              <key>HOMELAB_TRIGGER</key><string>watch</string>
            </dict>
            <key>StartInterval</key><integer>{{ watch_minutes | int * 60 }}</integer>
            <key>ProcessType</key><string>Background</string>
            <key>LowPriorityIO</key><true/>
            <key>Nice</key><integer>10</integer>
            <key>Umask</key><integer>63</integer>
            <key>StandardOutPath</key><string>{{ watch_logs }}/{{ watch_label }}.out.log</string>
            <key>StandardErrorPath</key><string>{{ watch_logs }}/{{ watch_label }}.err.log</string>
          </dict></plist>
      register: watch_agent
    - name: Inspect whether the watch job is loaded
      ansible.builtin.command:
        argv: [/bin/launchctl, print, '{{ watch_domain }}/{{ watch_label }}']
      changed_when: false
      check_mode: false
      failed_when: false
      register: watch_loaded
    # launchd caches a loaded definition: a changed plist needs a reload.
    - name: Unload a stale watch job definition
      ansible.builtin.command:
        argv: [/bin/launchctl, bootout, '{{ watch_domain }}/{{ watch_label }}']
      when: watch_agent.changed and watch_loaded.rc == 0
      failed_when: false
      changed_when: true
    - name: Load the watch job
      ansible.builtin.command:
        argv:
          [/bin/launchctl, bootstrap, '{{ watch_domain }}', '{{ watch_plist }}']
      when: watch_agent.changed or watch_loaded.rc != 0
      changed_when: true

# The manager's disk GC: the collector every worker runs
# (ansible/ubuntu/disk-gc.py) with the workers' policy (resourceSafety in
# ansible/ubuntu/policy.json), as the launchd job diskGc.label, hourly, or
# every 15 minutes when fleet.json says storage is disposable
# (fleet_storage_disposable). It runs as the user from a copy outside every
# revision, since it prunes the manager's homelab checkouts. macOS has no
# /proc: lsof names the directories processes run in. Its pressure mode
# starts where manager:disk warns. manager:disk-gc measures the job and reads
# the report it leaves.
- name: Collect the manager's disk garbage on a schedule
  hosts: localhost
  connection: local
  become: false
  # Same as the watch play: the minimal fact subset asks Homebrew and blocks
  # on its lock. HOME and the user id are read directly instead.
  gather_facts: false
  vars_files:
    - policy.json
  vars:
    gc_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    gc_label: '{{ diskGc.label }}'
    gc_logs: '{{ gc_home }}/{{ jobLogs.directory }}'
    gc_script: '{{ gc_home }}/{{ diskGc.script }}'
    gc_plist: '{{ gc_home }}/Library/LaunchAgents/{{ gc_label }}.plist'
    gc_on_disposable: '{{ fleet_storage_disposable | default(false) | bool }}'
  tasks:
    - name: Read the user id for the disk GC launchd domain
      ansible.builtin.command:
        argv: [/usr/bin/id, -u]
      check_mode: false
      changed_when: false
      register: gc_uid
    - name: Name the disk GC launchd domain
      ansible.builtin.set_fact:
        gc_domain: 'gui/{{ gc_uid.stdout }}'
      changed_when: false
    - name: Read the workers' disk GC policy
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../ubuntu/policy.json'
        name: ubuntu_policy
    - name: Create the directories of the disk GC job
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - '{{ gc_script | dirname }}'
        - '{{ gc_logs }}'
        - '{{ gc_home }}/{{ diskGc.report | dirname }}'
        - '{{ gc_home }}/Library/LaunchAgents'
    - name: Install the disk GC outside every revision
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../ubuntu/disk-gc.py'
        dest: '{{ gc_script }}'
        mode: '0644'
    - name: Install the disk GC launch agent
      ansible.builtin.copy:
        dest: '{{ gc_plist }}'
        mode: '0644'
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <!-- Managed by homelab: disk GC -->
          <plist version="1.0"><dict>
            <key>Label</key><string>{{ gc_label }}</string>
            <key>ProgramArguments</key><array>
              <string>/usr/bin/python3</string>
              <string>-I</string>
              <string>-B</string>
              <string>{{ gc_script }}</string>
              <string>--home</string><string>{{ gc_home }}</string>
              <string>--path</string><string>{{ gc_home }}</string>
              <string>--lsof</string>
              <string>--idle-days</string><string>{{ gc_idle_days }}</string>
              <string>--pressure-mib</string><string>{{ disk.warnFreeMiB }}</string>
          {% if gc_on_disposable %}
              <string>--target-used-percent</string><string>{{ fleet_storage_target_used_percent | default(gc_policy.diskGcDisposable.targetUsedPercent) }}</string>
              <string>--disposable</string>
          {% endif %}
              <string>--pressure-inode-percent</string><string>{{ gc_policy.inodeWarnFreePercent }}</string>
              <string>--pressure-idle-hours</string><string>{{ gc_policy.diskGcPressureIdleHours }}</string>
              <string>--docker-age-hours</string><string>{{ gc_policy.diskGcDockerAgeHours }}</string>
              <string>--pressure-docker-age-hours</string><string>{{ gc_policy.diskGcPressureDockerAgeHours }}</string>
              <string>--docker-cap-percent</string><string>{{ gc_policy.diskGcBuildCachePercent }}</string>
              <string>--home-cache-mib</string><string>{{ gc_policy.diskGcHomeCacheMiB }}</string>
          {% for root in diskGc.cacheRoots %}
              <string>--cache-root</string><string>{{ root }}</string>
          {% endfor %}
          {% for cache in gc_policy.diskGcExcludedCaches %}
              <string>--exclude-cache</string><string>{{ cache }}</string>
          {% endfor %}
          {% for store, mib in gc_policy.diskGcStoreCapsMiB.items() %}
              <string>--store-cap</string><string>{{ store }}={{ mib }}</string>
          {% endfor %}
          {% for root in gc_policy.diskGcWorktreeRoots %}
              <string>--worktree-root</string><string>{{ root }}</string>
          {% endfor %}
              <string>--worktree-idle-days</string><string>{{ gc_worktree_idle_days }}</string>
          {% for cache, mib in gc_policy.diskGcCacheCapsMiB.items() %}
              <string>--cache-cap</string><string>{{ cache }}={{ mib }}</string>
          {% endfor %}
          {% for root in gc_policy.diskGcCheckoutRoots %}
              <string>--keep-checkouts</string><string>{{ root }}={{ gc_policy.diskGcCheckoutsKept }}</string>
          {% endfor %}
              <string>--current</string><string>{{ gc_policy.diskGcCurrentCheckout }}</string>
          {% for directory, hours in gc_policy.diskGcExpireHours.items() %}
              <string>--expire</string><string>{{ directory }}={{ hours }}</string>
          {% endfor %}
              <string>--report</string><string>{{ gc_home }}/{{ diskGc.report }}</string>
              <string>--mise</string><string>{{ gc_home }}/.local/bin/mise</string>
            </array>
            <key>WorkingDirectory</key><string>{{ gc_home }}</string>
            <key>EnvironmentVariables</key><dict>
              <key>PATH</key><string>{{ gc_home }}/.local/share/mise/shims:{{ gc_home }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
            </dict>
            <key>StartInterval</key><integer>{{ gc_minutes | int * 60 }}</integer>
            <key>ProcessType</key><string>Background</string>
            <key>LowPriorityIO</key><true/>
            <key>Nice</key><integer>19</integer>
            <key>Umask</key><integer>63</integer>
            <key>StandardOutPath</key><string>/dev/null</string>
            <key>StandardErrorPath</key><string>{{ gc_logs }}/{{ gc_label }}.err.log</string>
          </dict></plist>
      vars:
        gc_policy: '{{ ubuntu_policy.resourceSafety }}'
        gc_idle_days: '{{ (gc_policy.diskGcDisposable.idleHours / 24) if gc_on_disposable else gc_policy.diskGcIdleDays }}'
        gc_worktree_idle_days: '{{ (gc_policy.diskGcDisposable.worktreeIdleHours / 24) if gc_on_disposable else gc_policy.diskGcWorktreeIdleDays }}'
        gc_minutes: '{{ gc_policy.diskGcDisposable.intervalMinutes if gc_on_disposable else gc_policy.diskGcIntervalMinutes }}'
      register: gc_agent
    - name: Inspect whether the disk GC job is loaded
      ansible.builtin.command:
        argv: [/bin/launchctl, print, '{{ gc_domain }}/{{ gc_label }}']
      changed_when: false
      check_mode: false
      failed_when: false
      register: gc_loaded
    # launchd caches a loaded definition: a changed plist needs a reload.
    - name: Unload a stale disk GC job definition
      ansible.builtin.command:
        argv: [/bin/launchctl, bootout, '{{ gc_domain }}/{{ gc_label }}']
      when: gc_agent.changed and gc_loaded.rc == 0
      failed_when: false
      changed_when: true
    - name: Load the disk GC job
      ansible.builtin.command:
        argv: [/bin/launchctl, bootstrap, '{{ gc_domain }}', '{{ gc_plist }}']
      when: gc_agent.changed or gc_loaded.rc != 0
      changed_when: true

# A skewed clock breaks TLS, token validation and Vault logins with errors
# that never mention time, and every worker's offset is measured against the
# manager's. macOS keeps its own time service; this asserts it is on.
# Reading it needs root, through the grant manager-privilege.yml installs;
# without the grant it is not asserted here, and manager:clock says so.
- name: Keep the manager's clock on network time
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Read whether network time is on
      ansible.builtin.command:
        argv: [/usr/bin/sudo, -n, /usr/sbin/systemsetup, -getusingnetworktime]
      changed_when: false
      check_mode: false
      failed_when: false
      register: network_time
    - name: Require network time
      ansible.builtin.assert:
        that:
          - "network_time.stdout is search('Network Time:\\s*On')"
        fail_msg: MANAGER_CLOCK_NOT_SYNCHRONISED; turn on Set time and date automatically in System Settings > General > Date & Time.
      when: network_time.rc == 0

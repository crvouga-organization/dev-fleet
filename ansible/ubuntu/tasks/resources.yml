---
# Memory and disk safety: a runaway workload is stopped on its own before the
# machine, SSH, Tailscale or the T3 server run out of memory or disk. These
# tasks run before the capacity preflight because they matter most when a disk
# is nearly full; they only write small files and never delete user data. The
# disk GC timer they install deletes only build output and caches a build or
# install recreates (ansible/ubuntu/disk-gc.py).
- name: Inspect active swap
  ansible.builtin.command:
    argv: [swapon, --show=NAME, --noheadings]
  changed_when: false
  check_mode: false
  register: active_swap
- name: Measure root free space before creating swap
  ansible.builtin.command:
    argv: [df, --output=avail, -BM, /]
  changed_when: false
  check_mode: false
  register: swap_capacity
  when: active_swap.stdout | trim == ''
- name: Refuse to create swap on a nearly full disk
  ansible.builtin.assert:
    that: (swap_capacity.stdout_lines | last | trim | regex_replace('M$', '') | int) >= worker_swap_file_mib | int + worker_minimum_free_disk_mib | int
    fail_msg: SWAP_CAPACITY_REQUIRED; free disk space so a swap file can be created. No swap is active.
  when: active_swap.stdout | trim == ''
- name: Create a swap file when the node has no swap
  ansible.builtin.command:
    argv: [fallocate, -l, '{{ worker_swap_file_mib }}M', /swap.fleet]
    creates: /swap.fleet
  when: active_swap.stdout | trim == ''
- name: Restrict the fleet swap file
  ansible.builtin.file:
    path: /swap.fleet
    owner: root
    group: root
    mode: '0600'
  when: active_swap.stdout | trim == ''
- name: Format the fleet swap file
  ansible.builtin.command:
    argv: [mkswap, /swap.fleet]
  when: active_swap.stdout | trim == ''
  changed_when: true
- name: Activate the fleet swap file
  ansible.builtin.command:
    argv: [swapon, /swap.fleet]
  when: active_swap.stdout | trim == ''
  changed_when: true
- name: Activate the fleet swap file at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swap.fleet none swap sw 0 0
  when: active_swap.stdout | trim == ''

- name: Install the systemd userspace OOM killer at its pin
  ansible.builtin.include_tasks: install.yml
  vars:
    install_pins:
      systemd-zram-generator: "{{ packages['systemd-zram-generator'] }}"
      systemd-oomd: "{{ packages['systemd-oomd'] }}"
- name: Declare compressed memory as the primary swap device
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      [zram0]
      zram-size = min(ram / {{ resourceSafety.zram.memoryDivisor }}, {{ resourceSafety.zram.maximumMiB }})
      swap-priority = {{ resourceSafety.zram.priority }}
  register: zram_config
- name: Start compressed swap and retain any disk swap for overflow
  ansible.builtin.systemd_service:
    name: dev-zram0.swap
    daemon_reload: '{{ zram_config.changed }}'
    state: started
- name: Declare reclaim tuning for compressed swap
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-personal-fleet-zram.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      vm.swappiness = {{ resourceSafety.zram.swappiness }}
      vm.page-cluster = {{ resourceSafety.zram.pageCluster }}
- name: Read the running reclaim settings
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, vm.swappiness, vm.page-cluster]
  changed_when: false
  check_mode: false
  register: reclaim_settings
- name: Apply reclaim tuning once compressed swap is active
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -p, /etc/sysctl.d/60-personal-fleet-zram.conf]
  when: reclaim_settings.stdout_lines != [resourceSafety.zram.swappiness | string, resourceSafety.zram.pageCluster | string]
  changed_when: true
- name: Create memory and disk policy directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/systemd/oomd.conf.d
    - /etc/systemd/system/-.slice.d
    - /etc/systemd/system/user.slice.d
    - '/etc/systemd/system/user@{{ development_uid }}.service.d'
    - /etc/systemd/user/app-t3code-agents.slice.d
    - /etc/systemd/user/app-t3code-agents-.slice.d
    - /etc/systemd/user/run-.service.d
    - /etc/systemd/user/run-.scope.d
    - /etc/systemd/user/t3code-.scope.d
    - /etc/systemd/journald.conf.d
    - /etc/systemd/system/systemd-tmpfiles-clean.timer.d
    - /etc/tmpfiles.d
- name: Declare systemd-oomd limits
  ansible.builtin.copy:
    dest: /etc/systemd/oomd.conf.d/60-personal-fleet.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync: kill one cgroup before swap or memory pressure stalls the node.
      [OOM]
      SwapUsedLimit=90%
      DefaultMemoryPressureLimit=60%
      DefaultMemoryPressureDurationSec=20s
  register: oomd_config
- name: Declare memory reserve and OOM policy for system and user slices
  ansible.builtin.copy:
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
    content: '{{ item.content }}'
  loop:
    - dest: /etc/systemd/system/-.slice.d/60-personal-fleet.conf
      content: |
        # Managed by personal fleet-sync: when swap is exhausted, oomd kills the largest swap user.
        [Slice]
        ManagedOOMSwap=kill
    - dest: /etc/systemd/system/user.slice.d/60-personal-fleet.conf
      content: |
        # Managed by personal fleet-sync: user workloads can never take the memory SSH, Tailscale and system services need.
        [Slice]
        MemoryMax={{ resourceSafety.userMemoryMax }}
    - dest: '/etc/systemd/system/user@{{ development_uid }}.service.d/60-personal-fleet.conf'
      content: |
        # Managed by personal fleet-sync: Ubuntu hands the user manager cpu, memory and pids only, which leaves
        # the I/O weights of T3 and the agents without effect. The user manager takes it on its next start.
        [Service]
        Delegate=cpu io memory pids
  loop_control:
    label: '{{ item.dest }}'
  register: slice_policy
- name: Bound each T3 agent so a runaway loses one process, not the session or the node
  ansible.builtin.copy:
    dest: /etc/systemd/user/t3code-.scope.d/60-personal-fleet.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync. Applies to every t3code-*.scope T3 starts for an agent.
      # OOMPolicy=continue: the kernel kills the largest process in the agent; the agent itself keeps running.
      # IOAccounting=yes: the pressure guard needs each agent's io.stat to tell a writer from a reader it blocks.
      [Scope]
      MemoryMax={{ resourceSafety.agentMemoryMax }}
      MemorySwapMax={{ resourceSafety.agentSwapMax }}
      OOMPolicy=continue
      IOAccounting=yes
  register: agent_policy
- name: Charge automatically named systemd-run jobs to the shared agent budget
  ansible.builtin.copy:
    dest: '/etc/systemd/user/run-.{{ item | lower }}.d/60-personal-fleet.conf'
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync. Detached builds share the agent budget.
      [{{ item }}]
      Slice=app-t3code-agents.slice
      MemoryMax={{ resourceSafety.agentMemoryMax }}
      MemorySwapMax={{ resourceSafety.agentSwapMax }}
      IOAccounting=yes
  loop: [Service, Scope]
  register: transient_limits
- name: Bound the combined agents and each thread of agents
  ansible.builtin.copy:
    dest: '/etc/systemd/user/{{ item.unit }}.slice.d/60-personal-fleet.conf'
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      [Slice]
      MemoryHigh={{ worker_size.memoryMiB | int * item.high | int // 100 }}M
      MemoryMax={{ worker_size.memoryMiB | int * item.max | int // 100 }}M
      MemorySwapMax={{ resourceSafety.agentSlice.swapMiB }}M
      TasksMax={{ resourceSafety.agentSlice.tasks }}
      CPUWeight={{ resourceSafety.agentSlice.weight }}
      IOWeight={{ resourceSafety.agentSlice.weight }}
      ManagedOOMMemoryPressure=kill
      ManagedOOMMemoryPressureLimit={{ resourceSafety.agentSlice.oomPressurePercent }}%
  loop:
    - unit: app-t3code-agents
      high: '{{ resourceSafety.agentSlice.highPercent }}'
      max: '{{ resourceSafety.agentSlice.maxPercent }}'
    - unit: app-t3code-agents-
      high: '{{ resourceSafety.agentSlice.threadHighPercent }}'
      max: '{{ resourceSafety.agentSlice.threadMaxPercent }}'
  register: agent_slices
- name: Restore the declared properties over systemctl set-property overrides
  become: true
  become_user: '{{ development_user }}'
  ansible.builtin.file:
    path: '{{ item.0 }}/systemd/user.control/app-t3code-agents.slice.d/50-{{ item.1 }}.conf'
    state: absent
  loop: "{{ [development_home ~ '/.config', '/run/user/' ~ development_uid] | product(['MemoryHigh', 'MemoryMax', 'MemorySwapMax', 'TasksMax', 'CPUWeight', 'IOWeight']) | list }}"
  register: agent_overrides
- name: Apply slice limits without restarting services
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: slice_policy.changed
- name: Load the agent limits into the running user manager for new agents
  become: true
  become_user: '{{ development_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  when: agent_policy.changed or transient_limits.changed or agent_slices.changed or agent_overrides.changed
  failed_when: false
- name: Run systemd-oomd
  ansible.builtin.systemd_service:
    name: systemd-oomd.service
    enabled: true
    state: '{{ "restarted" if oomd_config.changed else "started" }}'

- name: Cap the system journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-personal-fleet.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      [Journal]
      SystemMaxUse={{ resourceSafety.journalMaxUse }}
      SystemKeepFree={{ resourceSafety.journalKeepFree }}
      RuntimeMaxUse=256M
  register: journal_policy
- name: Apply the journal cap
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: journal_policy.changed
- name: Age out abandoned temporary files
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/tmp.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync; overrides /usr/lib/tmpfiles.d/tmp.conf.
      q /tmp 1777 root root {{ resourceSafety.tmpAge }}
      q /var/tmp 1777 root root {{ resourceSafety.varTmpAge }}
- name: Clean temporary files hourly instead of daily
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-tmpfiles-clean.timer.d/60-personal-fleet.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      [Timer]
      OnUnitActiveSec=1h
  register: tmpfiles_timer
- name: Inspect the RAM-backed /tmp unit
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/tmp.mount
  register: tmp_mount
- name: Create the /tmp mount policy directory
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: tmp_mount.stat.exists
- name: Bound RAM-backed /tmp (effective after the next reboot)
  ansible.builtin.copy:
    dest: /etc/systemd/system/tmp.mount.d/60-personal-fleet.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync: /tmp is RAM; keep it from taking half of memory.
      [Mount]
      Options=mode=1777,strictatime,nosuid,nodev,size={{ resourceSafety.tmpMaxSize }},nr_inodes=1m,x-systemd.graceful-option=usrquota
  when: tmp_mount.stat.exists
  register: tmp_policy
- name: Reload the cleanup timer and /tmp definitions
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: tmpfiles_timer.changed or tmp_policy.changed

- name: Read the tracked disk guard
  ansible.builtin.stat:
    path: '{{ development_source }}/ansible/ubuntu/disk-guard.py'
    checksum_algorithm: sha256
  register: disk_guard_source
  when: development_source is defined
- name: Declare the disk guard service
  ansible.builtin.copy:
    dest: /etc/systemd/system/personal-fleet-disk-guard.service
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync: ansible/ubuntu/disk-guard.py
      # Source sha256 {{ disk_guard_source.stat.checksum }}
      [Unit]
      Description=Personal Fleet disk guard (stops a runaway user writer before the disk fills)
      StartLimitIntervalSec=0
      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 -I -B {{ disk_guard_source.stat.path }} --path / --path {{ development_home }} --floor-mib {{ worker_disk_guard_floor_mib }} --inode-floor-percent {{ resourceSafety.inodeFailFreePercent }} --write-mib {{ resourceSafety.diskGuardWriteMiB }} --interval {{ resourceSafety.diskGuardIntervalSeconds }}
      Restart=always
      RestartSec=5
      OOMScoreAdjust=-1000
      MemoryMax=64M
      MemorySwapMax=0
      CPUQuota=10%
      TasksMax=4
      NoNewPrivileges=true
      PrivateTmp=true
      PrivateNetwork=true
      ProtectSystem=strict
      ProtectHome=read-only
      ReadWritePaths=/sys/fs/cgroup
      ProtectKernelModules=true
      LogRateLimitIntervalSec=60
      LogRateLimitBurst=20
      [Install]
      WantedBy=multi-user.target
  when: development_source is defined and disk_guard_source.stat.exists
  register: disk_guard_unit
- name: Run the disk guard
  ansible.builtin.systemd_service:
    name: personal-fleet-disk-guard.service
    daemon_reload: '{{ disk_guard_unit.changed }}'
    enabled: true
    state: '{{ "restarted" if disk_guard_unit.changed else "started" }}'
  when: development_source is defined and disk_guard_source.stat.exists

- name: Read the tracked disk GC
  ansible.builtin.stat:
    path: '{{ development_source }}/ansible/ubuntu/disk-gc.py'
    checksum_algorithm: sha256
  register: disk_gc_source
  when: development_source is defined
# storage.disposable in fleet.json (fleet_storage_disposable) switches every
# node to the disposable policy (docs/ubuntu-sync.md, Disk GC): hours instead
# of days, worktrees saved in a recovery ref or done with on their remote,
# Docker pruned whatever its age, pressure at a share of the disk, and a run
# every 15 minutes.
- name: Declare the disk GC service and its timer
  ansible.builtin.copy:
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
    content: '{{ item.content }}'
  vars:
    disposable: '{{ fleet_storage_disposable | default(false) | bool }}'
    gc_disposable: '{{ resourceSafety.diskGcDisposable }}'
    gc_idle_days: '{{ (gc_disposable.idleHours / 24) if disposable else resourceSafety.diskGcIdleDays }}'
    gc_worktree_idle_days: '{{ (gc_disposable.worktreeIdleHours / 24) if disposable else resourceSafety.diskGcWorktreeIdleDays }}'
    gc_minutes: '{{ gc_disposable.intervalMinutes if disposable else resourceSafety.diskGcIntervalMinutes }}'
    # hourly, or every 15 minutes (*:0/15) for a disposable fleet.
    gc_calendar: "{{ 'hourly' if gc_minutes | int == 60 else '*:0/' ~ gc_minutes }}"
  loop:
    - dest: /etc/systemd/system/personal-fleet-disk-gc.service
      content: |
        # Managed by personal fleet-sync: ansible/ubuntu/disk-gc.py
        # Source sha256 {{ disk_gc_source.stat.checksum }}
        [Unit]
        Description=Personal Fleet disk GC (deletes build output and caches a build recreates)
        After=docker.service
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/python3 -I -B {{ disk_gc_source.stat.path }} --home {{ development_home }} --path / --path {{ development_home }} --idle-days {{ gc_idle_days }} --pressure-mib {{ worker_disk_gc_pressure_mib }}{{ (' --target-used-percent ' ~ (fleet_storage_target_used_percent | default(gc_disposable.targetUsedPercent))) if disposable else '' }} --pressure-inode-percent {{ resourceSafety.inodeWarnFreePercent }} --pressure-idle-hours {{ resourceSafety.diskGcPressureIdleHours }} --docker-age-hours {{ resourceSafety.diskGcDockerAgeHours }} --pressure-docker-age-hours {{ resourceSafety.diskGcPressureDockerAgeHours }} --docker-cap-percent {{ resourceSafety.diskGcBuildCachePercent }} --host-var-tmp /run/dev-fleet-host-var-tmp --mise-cache-mib {{ resourceSafety.diskGcMiseCacheMiB }} --home-cache-mib {{ resourceSafety.diskGcHomeCacheMiB }}{% for cache in resourceSafety.diskGcExcludedCaches %} --exclude-cache {{ cache }}{% endfor %}{% for store, mib in resourceSafety.diskGcStoreCapsMiB.items() %} --store-cap {{ store }}={{ mib }}{% endfor %}{% for root in resourceSafety.diskGcWorktreeRoots %} --worktree-root {{ root }}{% endfor %} --worktree-idle-days {{ gc_worktree_idle_days }}{{ ' --disposable' if disposable else '' }}{% for cache, mib in resourceSafety.diskGcCacheCapsMiB.items() %} --cache-cap {{ cache }}={{ mib }}{% endfor %} --keep-newest /var/cache/personal-fleet={{ resourceSafety.diskGcPackagesKept }}{% for root in resourceSafety.diskGcCheckoutRoots %} --keep-checkouts {{ root }}={{ resourceSafety.diskGcCheckoutsKept }}{% endfor %} --current {{ resourceSafety.diskGcCurrentCheckout }}{% for directory, hours in resourceSafety.diskGcExpireHours.items() %} --expire {{ directory }}={{ hours }}{% endfor %} --report {{ resourceSafety.diskGcReport }} --mise {{ development_home }}/.local/bin/mise --user {{ development_user }}{{ '' if worker_containers_on | default(true) | bool else ' --no-docker' }}

        StateDirectory=personal-fleet-disk-gc
        StateDirectoryMode=0755
        TimeoutStartSec=2h
        Nice=19
        IOSchedulingClass=idle
        CPUQuota=50%
        MemoryMax=512M
        NoNewPrivileges=true
        PrivateTmp=true
        BindPaths=/var/tmp:/run/dev-fleet-host-var-tmp
        LogRateLimitIntervalSec=60
        LogRateLimitBurst=200
    - dest: /etc/systemd/system/personal-fleet-disk-gc.timer
      content: |
        # Managed by personal fleet-sync: ansible/ubuntu/disk-gc.py
        [Unit]
        Description=Run the Personal Fleet disk GC every {{ gc_minutes }} minutes
        [Timer]
        OnBootSec=10min
        OnCalendar={{ gc_calendar }}
        RandomizedDelaySec={{ [gc_minutes | int // 12, 1] | max }}min
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: '{{ item.dest }}'
  when: development_source is defined and disk_gc_source.stat.exists
  register: disk_gc_units
- name: Schedule the disk GC
  ansible.builtin.systemd_service:
    name: personal-fleet-disk-gc.timer
    daemon_reload: '{{ disk_gc_units.changed }}'
    enabled: true
    state: started
  when: development_source is defined and disk_gc_source.stat.exists

- name: Install the agent pressure guard
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/pressure-guard.py'
    dest: /usr/local/lib/personal-fleet-pressure-guard.py
    owner: root
    group: root
    mode: '0644'
  register: pressure_guard_script

- name: Declare the agent pressure guard
  ansible.builtin.copy:
    dest: /etc/systemd/system/personal-fleet-pressure-guard.service
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by personal fleet-sync.
      [Unit]
      Description=Relieve sustained pressure from agents and transient user jobs
      [Service]
      RuntimeDirectory=personal-fleet-pressure-guard
      ExecStart=/usr/bin/python3 -I -B /usr/local/lib/personal-fleet-pressure-guard.py --marker /run/personal-fleet-pressure-guard/active --agent-tree /sys/fs/cgroup/user.slice/user-{{ development_uid }}.slice/user@{{ development_uid }}.service/app.slice/app-t3code.slice/app-t3code-agents.slice --app-tree /sys/fs/cgroup/user.slice/user-{{ development_uid }}.slice/user@{{ development_uid }}.service/app.slice --threshold {{ resourceSafety.pressureGuard.threshold }} --duration {{ resourceSafety.pressureGuard.duration }} --cooldown {{ resourceSafety.pressureGuard.cooldown }} --interval {{ resourceSafety.pressureGuard.interval }}
      Restart=always
      RestartSec=5
      MemoryMax=64M
      MemorySwapMax=0
      Nice=-10
      OOMScoreAdjust=-1000
      CPUWeight=1000
      IOWeight=1000
      NoNewPrivileges=true
      ProtectHome=true
      ProtectSystem=strict
      ReadWritePaths=-/sys/fs/cgroup/user.slice/user-{{ development_uid }}.slice/user@{{ development_uid }}.service
      PrivateNetwork=true
      [Install]
      WantedBy=multi-user.target
  register: pressure_guard_unit

- name: Run the agent pressure guard
  ansible.builtin.systemd_service:
    name: personal-fleet-pressure-guard.service
    enabled: true
    daemon_reload: '{{ pressure_guard_unit.changed }}'
    state: '{{ "restarted" if pressure_guard_unit.changed or pressure_guard_script.changed else "started" }}'

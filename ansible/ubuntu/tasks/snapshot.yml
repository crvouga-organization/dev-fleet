---
# The snapshot every managed package comes from, separate from the system's
# own sources. Included before any pinned package is installed; a second
# inclusion in one run changes nothing.
- name: Create owned APT configuration directory
  ansible.builtin.file:
    path: /etc/personal-fleet
    state: directory
    owner: root
    group: root
    mode: '0755'
# Indexes come only from the snapshot: they are what pins every version.
# Packages come first from Ubuntu's own mirrors, which are fast, and from the
# snapshot when a mirror no longer holds that version. APT checks every
# package against the snapshot's signed index wherever it came from. The list
# is named after the snapshot so its index files are too (see below).
- name: Declare where snapshot indexes and packages are fetched from
  ansible.builtin.copy:
    dest: /etc/personal-fleet/ubuntu-mirrors-{{ snapshot }}.list
    owner: root
    group: root
    mode: '0644'
    content: |
      https://archive.ubuntu.com/ubuntu/	priority:1 type:deb arch:amd64 arch:all
      https://ports.ubuntu.com/ubuntu-ports/	priority:1 type:deb arch:arm64 arch:all
      https://snapshot.ubuntu.com/ubuntu/{{ snapshot }}/	priority:2
- name: Declare snapshot sources used only for managed package transactions
  ansible.builtin.copy:
    dest: /etc/personal-fleet/ubuntu.sources
    owner: root
    group: root
    mode: '0644'
    backup: true
    content: |
      Types: deb
      URIs: mirror+file:/etc/personal-fleet/ubuntu-mirrors-{{ snapshot }}.list
      Suites: {{ ubuntu_release.codename }} {{ ubuntu_release.codename }}-updates {{ ubuntu_release.codename }}-security
      Components: main universe restricted multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  register: snapshot_sources
# The snapshot's indexes live in a directory of their own. An apt update
# of the system's own sources (unattended upgrades, the Tailscale play)
# removes the index files of every source it does not know, so kept beside
# them the snapshot was fetched again on every sync; and fetching the
# snapshot leaves the system's indexes alone.
- name: Create the snapshot's own index directory
  ansible.builtin.file:
    path: /var/lib/personal-fleet/apt-lists/partial
    state: directory
    owner: root
    group: root
    mode: '0755'
# The snapshot server stalls now and then: a download that stops moving is
# dropped after a minute and fetched again, rather than holding the run
# until whatever runs it gives up. Translated descriptions are never read
# here, so they are not fetched from it either.
- name: Isolate snapshot selection from unrelated APT operations
  ansible.builtin.copy:
    dest: /etc/personal-fleet/apt.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      Dir::Etc::sourcelist "/etc/personal-fleet/ubuntu.sources";
      Dir::Etc::sourceparts "-";
      Dir::State::Lists "/var/lib/personal-fleet/apt-lists/";
      APT::Get::List-Cleanup "false";
      DPkg::Lock::Timeout "{{ aptLockTimeoutSeconds }}";
      Acquire::Retries "3";
      Acquire::http::Timeout "60";
      Acquire::https::Timeout "60";
      Acquire::Languages "none";
- name: Inspect immutable snapshot package index
  ansible.builtin.stat:
    path: '/var/lib/personal-fleet/apt-lists/_etc_personal-fleet_ubuntu-mirrors-{{ snapshot }}.list_dists_{{ ubuntu_release.codename }}_InRelease'
  register: snapshot_index
- name: Fetch signed snapshot indexes after source change or interrupted setup
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
    lock_timeout: '{{ aptLockTimeoutSeconds }}'
  environment:
    APT_CONFIG: /etc/personal-fleet/apt.conf
  when: snapshot_sources.changed or not snapshot_index.stat.exists

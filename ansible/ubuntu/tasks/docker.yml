---
- name: Rotate container logs by default (new containers, after the next Docker restart)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    force: false
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "{{ resourceSafety.dockerLogMaxSize }}", "max-file": "{{ resourceSafety.dockerLogMaxFiles }}" }
      }
    validate: dockerd --validate --config-file %s
- name: Start the native Docker engine without restarting existing workloads
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
- name: Grant the designated developer access to the local Docker engine
  ansible.builtin.user:
    name: '{{ development_user }}'
    groups: docker
    append: true
- name: Verify native Docker Compose and Buildx installation
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [docker, compose, version]
    - [docker, buildx, version]
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode
# The engine answering is not proof that an agent can use it: run a pinned
# image and build a one-line image as the developer, in a fresh session that
# reads the docker group from scratch. The image is cached here so the same
# test works offline in worker:docker-run.
#
# The fresh session is made here, by runuser as root, and not by
# `become_user`: Ansible skips becoming the user who already runs the play,
# which the developer does on a worker. The command then ran in the session
# that started before the group was granted, and the first sync of a new
# worker ended with "permission denied" on the Docker socket.
- name: Look for the cached smoke-test image
  ansible.builtin.command:
    argv:
      [
        runuser,
        -u,
        '{{ development_user }}',
        --,
        docker,
        image,
        inspect,
        --format,
        '{{ "{{.Id}}" }}',
        '{{ dockerSmokeTest.image }}',
      ]
  environment:
    HOME: '{{ development_home }}'
  check_mode: false
  changed_when: false
  failed_when: false
  register: docker_smoke_image
- name: Cache the pinned smoke-test image
  ansible.builtin.command:
    argv:
      [
        runuser,
        -u,
        '{{ development_user }}',
        --,
        docker,
        pull,
        --quiet,
        '{{ dockerSmokeTest.image }}',
      ]
  environment:
    HOME: '{{ development_home }}'
  when: docker_smoke_image.rc | default(0) != 0
  changed_when: true
# An image referenced by a stopped container survives docker image prune -a.
# Give each digest its own reference so upgrades can protect the new image
# before retiring references that belong to this task.
- name: Read the Docker smoke image references managed by the fleet
  ansible.builtin.command:
    argv:
      [
        docker,
        container,
        ls,
        --all,
        --filter,
        label=dev-fleet.smoke-image,
        --format,
        '{{ "{{.Names}}" }}',
      ]
  changed_when: false
  check_mode: false
  # A fresh machine has no engine yet in a check-mode preview.
  failed_when: docker_smoke_references.rc != 0 and not ansible_check_mode
  register: docker_smoke_references
- name: Retain the current offline smoke image across disk cleanup
  vars:
    reference: "dev-fleet-smoke-{{ dockerSmokeTest.image.split('@sha256:')[1] }}"
  block:
    - name: Create a stopped reference to the pinned image
      ansible.builtin.command:
        argv:
          [
            docker,
            create,
            --name,
            '{{ reference }}',
            --label,
            dev-fleet.smoke-image,
            --network,
            none,
            --pull,
            never,
            '{{ dockerSmokeTest.image }}',
            'true',
          ]
      when: reference not in (docker_smoke_references.stdout_lines | default([]))
      changed_when: true
    - name: Retire stopped references to earlier fleet smoke images
      ansible.builtin.command:
        argv: [docker, container, rm, '{{ item }}']
      loop: "{{ docker_smoke_references.stdout_lines | default([]) | select('match', '^dev-fleet-smoke-[0-9a-f]{64}$') | reject('equalto', reference) | list }}"
      changed_when: true
- name: Run a container as the developer, offline (DOCKER_RUN_FAILED)
  ansible.builtin.command:
    argv:
      [
        runuser,
        -u,
        '{{ development_user }}',
        --,
        docker,
        run,
        --rm,
        --network,
        none,
        --pull,
        never,
        '{{ dockerSmokeTest.image }}',
        'true',
      ]
  environment:
    HOME: '{{ development_home }}'
  timeout: '{{ dockerSmokeTest.timeoutSeconds }}'
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode
- name: Build a one-line image as the developer, offline (DOCKER_BUILD_FAILED)
  ansible.builtin.command:
    argv:
      [
        runuser,
        -u,
        '{{ development_user }}',
        --,
        docker,
        build,
        --quiet,
        --pull=false,
        --network,
        none,
        '-',
      ]
    stdin: |
      FROM {{ dockerSmokeTest.image }}
      RUN true
  environment:
    HOME: '{{ development_home }}'
  timeout: '{{ dockerSmokeTest.timeoutSeconds }}'
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode

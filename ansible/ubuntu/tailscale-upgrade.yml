---
# Tailscale on one worker upgraded to its pin, applied from the manager by
# fleet-sync --maintenance-reboot when the worker's converge stopped with
# TAILSCALE_UPGRADE_PENDING. The upgrade is the worker's own tailscale.yml of
# the approved revision, applied with tailscale_upgrade in a transient system
# unit: a restart of tailscaled that drops this SSH session cannot interrupt
# it. The play then waits for the worker to answer again and for the unit to
# end, and reads how it ended. After it returns, fleet-sync converges the
# worker again, which measures Tailscale against its pin.
# Variables: target (the SSH alias, or the declared tailnet name), login
# (empty for the alias's own user), ssh_options (the SSH options every session
# of the manager takes, src/ssh-connection.ts), home (the account's home
# directory) and revision (the checkout whose tailscale.yml is applied).
- name: Address the worker
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check the request
      ansible.builtin.assert:
        that:
          - "target is match('^[a-zA-Z0-9][a-zA-Z0-9._-]{0,252}$')"
          - ssh_options is string and ssh_options is match('^-o ')
          - "home is match('^/[A-Za-z0-9._/-]{1,4000}$')"
          - "revision is match('^[a-f0-9]{40}$')"
    - name: Address the worker by its alias, with strict host keys
      ansible.builtin.add_host:
        name: '{{ target }}'
        groups: [fleet_tailscale_upgrade]
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_args: -o ControlMaster=no -o ControlPath=none
        ansible_ssh_common_args: '{{ ssh_options }}'
        worker_checkout: '{{ home }}/.local/share/personal/fleet/revisions/{{ revision }}'
      changed_when: false
      when: login | default('') == ''
    - name: Address the worker by its alias as the declared account
      ansible.builtin.add_host:
        name: '{{ target }}'
        groups: [fleet_tailscale_upgrade]
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_args: -o ControlMaster=no -o ControlPath=none
        ansible_ssh_common_args: '{{ ssh_options }}'
        ansible_user: '{{ login }}'
        worker_checkout: '{{ home }}/.local/share/personal/fleet/revisions/{{ revision }}'
      changed_when: false
      when: login | default('') is match('^[a-z_][a-z0-9_-]{0,31}$')

- name: Upgrade Tailscale to its pin in a detached unit
  hosts: fleet_tailscale_upgrade
  gather_facts: false
  serial: 1
  become: true
  vars:
    upgrade_unit: devfleet-tailscale-upgrade.service
  tasks:
    - name: Find the approved revision's Tailscale play
      ansible.builtin.stat:
        path: '{{ worker_checkout }}/ansible/ubuntu/tailscale.yml'
      register: tailscale_play
    - name: Require the approved revision on the worker
      ansible.builtin.assert:
        that: tailscale_play.stat.exists
        fail_msg: WORKER_TAILSCALE_UPGRADE_FAILED; the approved revision is not checked out on the worker. Run fleet-sync first.
    # A unit that failed in an earlier run stays loaded with its result.
    - name: Forget how an earlier upgrade ended
      ansible.builtin.command:
        argv: [systemctl, reset-failed, '{{ upgrade_unit }}']
      changed_when: false
      check_mode: false
      failed_when: false
    - name: Look for an upgrade that is still running
      ansible.builtin.command:
        argv: [systemctl, is-active, '{{ upgrade_unit }}']
      register: upgrade_before
      changed_when: false
      check_mode: false
      failed_when: false
    - name: Start the upgrade in a transient unit of its own
      ansible.builtin.command:
        argv:
          - systemd-run
          - '--unit={{ upgrade_unit }}'
          - --description=dev-fleet Tailscale upgrade to its pin
          - '--working-directory={{ worker_checkout }}/ansible/ubuntu'
          - '--setenv=ANSIBLE_CONFIG={{ worker_checkout }}/ansible/ansible.cfg'
          - --setenv=HOME=/root
          - /usr/bin/ansible-playbook
          - tailscale.yml
          - --extra-vars
          - tailscale_upgrade=true
      changed_when: true
      when: upgrade_before.stdout not in ['active', 'activating']
    # The upgrade restarts tailscaled; a session over the tailnet drops and
    # comes back.
    - name: Wait for the worker to answer again
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 600
    - name: Wait for the upgrade to end
      ansible.builtin.command:
        argv: [systemctl, is-active, '{{ upgrade_unit }}']
      register: upgrade_state
      changed_when: false
      check_mode: false
      failed_when: false
      until: upgrade_state.stdout not in ['active', 'activating', 'deactivating']
      retries: 120
      delay: 5
    # A transient unit that succeeded is unloaded and reads as success; one
    # that failed stays loaded with its result.
    - name: Read how the upgrade ended
      ansible.builtin.command:
        argv:
          [systemctl, show, --property=Result, --value, '{{ upgrade_unit }}']
      register: upgrade_result
      changed_when: false
      check_mode: false
    - name: Require an upgrade that succeeded
      ansible.builtin.assert:
        that:
          - upgrade_state.stdout not in ['active', 'activating', 'deactivating']
          - upgrade_result.stdout | trim == 'success'
        fail_msg: WORKER_TAILSCALE_UPGRADE_FAILED; the upgrade did not end, or failed. Read journalctl -u devfleet-tailscale-upgrade on the worker.

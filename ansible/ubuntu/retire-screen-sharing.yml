---
- name: Retire the desktop sharing service managed by the fleet
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Inspect the credential publisher ownership marker
      ansible.builtin.slurp:
        src: /etc/systemd/system/devfleet-rdp-credential.service
      register: rdp_unit_file
    - name: Refuse a publisher managed by someone else
      ansible.builtin.assert:
        that: (rdp_unit_file.content | b64decode).startswith('# Managed by dev-fleet screen sharing')
    - name: Stop publishing the session credential at boot
      ansible.builtin.systemd_service:
        name: devfleet-rdp-credential.service
        state: stopped
        enabled: false
    - name: Retire sharing in the desktop user's session
      become: true
      become_user: '{{ development_user }}'
      environment:
        XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
        DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ development_uid }}/bus'
        HOME: '{{ development_home }}'
      block:
        - name: Disable sharing the graphical session
          ansible.builtin.command:
            argv:
              [
                gsettings,
                set,
                org.gnome.desktop.remote-desktop.rdp,
                enable,
                'false',
              ]
          changed_when: true
        - name: Stop and disable the user service
          ansible.builtin.systemd_service:
            scope: user
            name: gnome-remote-desktop.service
            state: stopped
            enabled: false
        - name: Remove the published RDP item from the volatile session keyring
          ansible.builtin.command:
            argv:
              [
                /usr/bin/python3,
                /etc/personal-fleet/screen-sharing-credential.py,
                retire,
              ]
          changed_when: true
    - name: Remove the fleet credential and publisher
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/personal-fleet/rdp-password.cred
        - /etc/personal-fleet/screen-sharing-credential.py
        - /etc/systemd/system/devfleet-rdp-credential.service
    - name: Reload the system manager after removing the credential service
      ansible.builtin.systemd_service:
        daemon_reload: true

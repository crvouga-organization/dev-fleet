name: Pins
# The pins Renovate cannot move because a digest is written beside each
# version: mise itself and T3 Code. bootstrap/pins.ts moves one to its newest
# release, digests included, and this opens the pull request; CI, the fresh
# workers and the VM test then decide like for any other change. A push made
# with the workflow's own token starts no CI, so this workflow starts CI on
# the branch itself; its checks count for the pull request, and auto-merge.yml
# has it merged when they pass. With the PINS_TOKEN secret (a fine-grained token
# or an app's, with contents and pull requests write) the push starts CI as
# any other does.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: pins
  cancel-in-progress: false
jobs:
  pin:
    name: Update ${{ matrix.pin }}
    strategy:
      fail-fast: false
      matrix:
        pin:
          [
            mise,
            t3,
            codex,
            claude,
            gemini,
            copilot,
            opencode,
            grok,
            antigravity,
          ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.PINS_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/mise
        if: matrix.pin != 'mise' && matrix.pin != 't3'
        with:
          install_args: python
      - name: Move the pin to its newest release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ matrix.pin }}
        run: |
          case "$PIN" in
            mise|t3) summary=$(bun bootstrap/pins.ts "$PIN") ;;
            *) summary=$(python3 .github/scripts/provider-pin.py "$PIN") ;;
          esac
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN || github.token }}
          PIN: ${{ matrix.pin }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          OWN_TOKEN: ${{ secrets.PINS_TOKEN == '' }}
        run: |
          git diff --quiet && { echo "$SUMMARY"; exit 0; }
          branch="pins/$PIN"
          # GitHub's own Actions account, by its public id.
          bot='github-actions[bot]'
          git config user.name "$bot"
          git config user.email "41898282+${bot}@users.noreply.github.com"
          git switch -C "$branch"
          git add -- mise.toml mise.lock .mise/locks
          git commit --all --message "chore(deps): $SUMMARY"
          git push --force origin "$branch"
          open=$(gh pr list --base main --head "$branch" --state open --json number --jq length)
          if [ "$open" = 0 ]; then
            gh pr create --head "$branch" --label deps --title "chore(deps): $SUMMARY" \
              --body "Moves the $PIN pin, with every digest, to its newest release: $SUMMARY."
          fi
          # A pull request opened with the workflow's own token starts no
          # auto-merge.yml run, so auto-merge is enabled here.
          gh pr merge --auto --squash "$branch" ||
            echo "::warning::Auto-merge could not be enabled on $branch."
          if [ "$OWN_TOKEN" = true ]; then gh workflow run ci.yml --ref "$branch"; fi

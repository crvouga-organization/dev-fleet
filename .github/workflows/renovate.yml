name: Renovate
# Renovate opens at most two pull requests an hour (config:recommended), so it
# runs every hour: a daily run let a backlog grow by more than it cleared, and
# a pull request that conflicts after another merges is rebased an hour later
# rather than a day.
#
# Renovate commits through GitHub's API. The workflow's own token may not
# change a file under .github/workflows, so an update to an action or image
# there is refused and Renovate says so only in its debug log; the dashboard
# lists the branch under "Other Branches" for ever. PINS_TOKEN (a fine-grained
# token for this repository with contents, issues, pull requests and workflows
# write) lets those updates through; without it the run warns.
on:
  schedule:
    - cron: '33 * * * *'
  workflow_dispatch: {}
concurrency:
  group: renovate
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    container:
      image: ghcr.io/renovatebot/renovate:44.263.5@sha256:9806d1b444f2b0b57d7c3b882d453b99c7494db07689c2e1abed8e6ae502b271
    steps:
      - name: Update this repository using its Renovate configuration
        env:
          RENOVATE_TOKEN: ${{ secrets.PINS_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
        run: renovate "$REPOSITORY"
      - name: Warn that updates to workflow files cannot be pushed
        env:
          OWN_TOKEN: ${{ secrets.PINS_TOKEN == '' }}
        run: |
          if [ "$OWN_TOKEN" = true ]; then
            echo "::warning::Renovate runs with the workflow's own token, which may not change .github/workflows; set PINS_TOKEN (contents, issues, pull requests and workflows write) to let those updates through."
          fi

  checks:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with the workflow's own token either starts no
      # CI, or starts a run that waits for a maintainer's approval
      # (action_required) and never runs. A waiting run is approved: it then
      # runs for the pull request, and only a pull_request run's checks count
      # for it (a dispatched run reports on the commit, not the pull request).
      # A branch with no run at all gets a dispatched one. The pins/ branches
      # pins.yml opens the same way are included.
      - name: Start CI for dependency updates whose push did not trigger it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --limit 200 --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false and (.headRefName | startswith("renovate/") or startswith("pins/"))) | [.headRefName,.headRefOid] | @tsv' |
          while read -r branch commit; do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$commit" \
              --jq '.workflow_runs[] | [.id, .conclusion // ""] | @tsv')
            if [ -z "$runs" ]; then gh workflow run ci.yml --ref "$branch"; continue; fi
            printf '%s\n' "$runs" | while read -r id conclusion; do
              if [ "$conclusion" = action_required ]; then
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null ||
                  echo "::warning::CI for $branch waits for approval and could not be approved."
              fi
            done
          done
      # A pull request opened with the workflow's own token starts no
      # auto-merge.yml run, so auto-merge is enabled here.
      - name: Enable auto-merge on dependency updates
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --limit 200 --json number,headRefName,isDraft,isCrossRepository,autoMergeRequest \
            --jq '.[] | select(.isCrossRepository == false and .isDraft == false and .autoMergeRequest == null and (.headRefName | startswith("renovate/"))) | .number' |
          while read -r number; do
            gh pr merge --auto --squash "$number" ||
              echo "::warning::Auto-merge could not be enabled on #$number."
          done

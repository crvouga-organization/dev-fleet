name: Catch up main
# A merge made with the workflow's own token (auto-merge.yml without
# AUTO_MERGE_TOKEN) starts no workflow: no CI on main, and so no release, and
# the issues its pull request fixes stay open. This starts CI on main when its
# newest commit has no run (CI on main started that way starts the release
# itself when it passes) and closes the issues merged pull requests fix.
#
# It runs each time a pull request from this repository opens (called by
# auto-merge.yml, in the same run) and once a day for quiet days.
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write
concurrency:
  group: catch-up-main
  cancel-in-progress: false
jobs:
  reconcile:
    name: Start CI on main and close fixed issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      MAIN: ${{ github.event.repository.default_branch }}
    steps:
      - name: Start CI on main when its newest commit has no run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api "repos/$REPO/commits/$MAIN" --jq .sha)
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$commit&branch=$MAIN" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          if [ "$runs" -gt 0 ]; then
            echo "CI has a run for $commit."
          else
            echo "No CI run for $commit: starting one."
            gh workflow run ci.yml --repo "$REPO" --ref "$MAIN"
          fi
      - name: Close the issues that merged pull requests fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$REPO" --state merged --base "$MAIN" --limit 100 \
            --json number,mergedAt,closingIssuesReferences \
            --jq ".[] | select(.mergedAt >= \"$since\") | .number as \$pr | .closingIssuesReferences[] | select(.repository.owner.login + \"/\" + .repository.name == \"$REPO\") | [.number, \$pr] | @tsv" |
          while read -r issue pr; do
            gh issue view "$issue" --repo "$REPO" --json state \
              --jq 'select(.state == "OPEN") | 1' | grep -q 1 || continue
            gh issue close "$issue" --repo "$REPO" --reason completed --comment "Fixed by #$pr." ||
              echo "::warning::Issue #$issue could not be closed."
          done

name: Auto-merge
# Every pull request from a branch of this repository has GitHub's native
# auto-merge enabled when it is opened or marked ready, so it is squash-merged
# as soon as its checks pass; the branch is deleted by the repository setting.
# Pull requests from forks and drafts are left to a person. Nothing here polls:
# no schedule and no workflow_run.
#
# Auto-merge is enabled with AUTO_MERGE_TOKEN (a maintainer's token) when it
# is set, and with the workflow's own token otherwise. A merge made with the
# workflow's own token starts no workflow at all: no CI on main, and so no
# release. So each pull request that opens also starts CI on main when the
# newest commit there has no run (catch-up.yml, which also runs once a day),
# and CI on main started that way starts the release itself when it passes.
# Set AUTO_MERGE_TOKEN to have every merge start CI and its release at once.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.auto_merge == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  catch-up:
    name: Catch up main
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    uses: ./.github/workflows/catch-up.yml
